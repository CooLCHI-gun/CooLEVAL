<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- CooLEVAL logo: dial with melting red reliability arc -->
  <circle cx="50" cy="50" r="44" fill="#050711" stroke="#E6E9F2" stroke-width="4"/>
  <!-- 240 degree arc sweeping clockwise from 12 o'clock, last ~40deg sags into a drip -->
  <path d="M 50 8
           A 42 42 0 1 1 31.5 17.9
           C 34 22 40 26 45 27
           C 49 27.8 52 30 53 33.5
           C 54 36.5 52.5 39.5 50 41"
        fill="none" stroke="#FF4B4B" stroke-width="6" stroke-linecap="round"/>
  <!-- melt drip -->
  <circle cx="50" cy="44" r="3.2" fill="#FF4B4B"/>
  <!-- green start tick at 12 o'clock -->
  <path d="M 46.5 8 L 46.5 13.5 M 53.5 8 L 53.5 13.5" stroke="#3DD68C" stroke-width="4" stroke-linecap="round"/>
</svg>
